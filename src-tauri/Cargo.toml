[package]
name = "app"
version = "0.1.0"
description = "Skills Manager - Local CodeFlicker Skills Management Tool"
authors = ["you"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
zip = "2"
tar = "0.4"
flate2 = "1"
walkdir = "2"
dirs = "5"
